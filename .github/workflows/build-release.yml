name: Build & Publish Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: '34.0.0'
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 || secrets.kEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Collect signed APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          signed_apks=(app/build/outputs/apk/release/*-signed.apk)
          if (( ${#signed_apks[@]} == 0 )); then
            echo "No signed APKs found in app/build/outputs/apk/release" >&2
            exit 1
          fi

          mkdir -p release-artifacts
          version_tag="${GITHUB_REF_NAME//\//-}"

          for apk in "${signed_apks[@]}"; do
            if (( ${#signed_apks[@]} == 1 )); then
              output="release-artifacts/Vydra-${version_tag}.apk"
            else
              apk_name="$(basename "$apk" -signed.apk)"
              output="release-artifacts/Vydra-${version_tag}-${apk_name}.apk"
            fi
            cp "$apk" "$output"
          done

          ls -lh release-artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vydra-release-apk
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
