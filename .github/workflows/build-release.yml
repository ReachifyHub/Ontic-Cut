name: Build & Publish Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # Changed from 'read' to 'write' so it can upload to the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Sign Android Release
        uses: r0adkll/sign-android-release@v1
        id: sign
        continue-on-error: false
        env:
          BUILD_TOOLS_VERSION: '34.0.0'
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 || secrets.kEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Collect Release APK Artifacts
        run: |
          mkdir -p release-artifacts
          found=0
          for apk in app/build/outputs/apk/release/*-signed.apk; do
            if [ -f "$apk" ]; then
              # Rename the APK to include the version tag (e.g., Vydra-v1.0.0-beta1.apk)
              VERSION_TAG=${GITHUB_REF#refs/tags/}
              cp "$apk" "release-artifacts/Vydra-${VERSION_TAG}.apk"
              found=1
            fi
          done
          if [ $found -eq 0 ]; then
            for apk in app/build/outputs/apk/release/*.apk; do
              if [ -f "$apk" ]; then
                VERSION_TAG=${GITHUB_REF#refs/tags/}
                cp "$apk" "release-artifacts/Vydra-${VERSION_TAG}.apk"
              fi
            fi
          done
          ls -lh release-artifacts/

      - name: Upload Release APK Artifact (For Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: vydra-release-apk
          path: release-artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      # === NEW STEP: Publish to GitHub Releases Page ===
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
